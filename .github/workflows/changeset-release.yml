name: Create Changeset Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release type"
        required: true
        type: choice
        options:
          - minor
          - major
      notes:
        description: "Release notes"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  create-changeset:
    name: Create changeset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create branch
        run: git checkout -b "changeset-release/${{ github.run_id }}"

      - name: Create changeset file
        env:
          BUMP: ${{ inputs.bump }}
          NOTES: ${{ inputs.notes }}
        run: |
          FILE=".changeset/release-${{ github.run_id }}.md"
          cat > "$FILE" <<EOF
          ---
          "@kteneyck/cesium-timeline-core": $BUMP
          "@kteneyck/cesium-timeline-react": $BUMP
          "@kteneyck/cesium-timeline-angular": $BUMP
          ---

          $NOTES
          EOF

      - name: Commit and push changeset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .changeset
          git commit -m "chore: add changeset for ${{ inputs.bump }} release"
          git push -u origin "changeset-release/${{ github.run_id }}"

      - name: Open pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh pr create \
            --base main \
            --head "changeset-release/${{ github.run_id }}" \
            --title "chore: add changeset for $BUMP release" \
            --body "$NOTES"
